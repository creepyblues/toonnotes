# ToonNotes Boards Navigation Flow
# Tests Boards tab and board navigation
# Expected duration: ~25-35s
#
# UPDATED: February 2026 - Fixed back optional syntax, removed anyOf
# REQUIRES: App must be connected to dev server or running as production build

appId: com.toonnotes.app

---
- launchApp

# Wait for home screen
- extendedWaitUntil:
    visible: "ToonNotes"
    timeout: 15000

# Navigate to Boards tab
- tapOn:
    text: "Boards"
    optional: true

# Wait for Boards screen to load
- extendedWaitUntil:
    visible: ".*"
    timeout: 5000

# Check for boards content
- assertVisible:
    text: "Boards"
    optional: true

# If there are boards, try tapping one (optional)
- tapOn:
    id: "BoardCard"
    optional: true

# Wait for potential board detail view
- waitForAnimationToEnd

# Navigate back
- back

# Go back to Notes/Home tab
- tapOn:
    text: "Notes"
    optional: true

- tapOn:
    text: "Home"
    optional: true

# Verify we're back
- extendedWaitUntil:
    visible: "ToonNotes"
    timeout: 5000
