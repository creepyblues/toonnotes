# ToonNotes Create Note Flow
# Tests creating a new note with title and content
# Expected duration: ~30-45s
#
# UPDATED: February 2026 - Fixed extendedWaitUntil syntax
# REQUIRES: App must be connected to dev server or running as production build

appId: com.toonnotes.app

---
- launchApp

# Wait for home screen to load
- extendedWaitUntil:
    visible: "ToonNotes"
    timeout: 15000

# Tap FAB to create new note
- tapOn:
    id: "Create new note"
    optional: true

# Fallback: try bottom-right corner for FAB
- tapOn:
    point: "90%,85%"
    optional: true

# Wait for editor to open - look for Title placeholder
- extendedWaitUntil:
    visible: ".*"
    timeout: 5000

# Enter note title
- tapOn:
    text: "Title"
    optional: true
- inputText: "Test Note from Maestro"

# Wait a moment for auto-save
- waitForAnimationToEnd

# Navigate back to save and return to list
- back

# Wait for navigation to complete
- extendedWaitUntil:
    visible: "ToonNotes"
    timeout: 5000

# Verify the new note appears in the list
- assertVisible:
    text: "Test Note from Maestro"
    optional: true
