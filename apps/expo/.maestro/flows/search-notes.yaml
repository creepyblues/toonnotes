# ToonNotes Search Flow
# Tests search functionality on home screen
# Expected duration: ~20-30s
# Note: Requires at least one note to exist for meaningful search
#
# UPDATED: February 2026 - Fixed inputText optional syntax, removed anyOf
# REQUIRES: App must be connected to dev server or running as production build

appId: com.toonnotes.app

---
- launchApp

# Wait for home screen
- extendedWaitUntil:
    visible: "ToonNotes"
    timeout: 15000

# Look for search button or search bar
- tapOn:
    id: "Search notes"
    optional: true

# Alternative: tap on search icon if present
- tapOn:
    text: "Search"
    optional: true

# If search input is now visible, wait for it
- extendedWaitUntil:
    visible: ".*"
    timeout: 3000

# Type search query
- inputText: "test"

# Wait briefly for search results
- waitForAnimationToEnd

# Clear search / close search
- tapOn:
    id: "Close search"
    optional: true

# Press back to close search
- back

# Verify we're back to normal view
- extendedWaitUntil:
    visible: "ToonNotes"
    timeout: 3000
