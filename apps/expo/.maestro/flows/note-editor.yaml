# ToonNotes Note Editor Flow
# Tests editor functionality including text input and toolbar
# Expected duration: ~30-40s
#
# UPDATED: February 2026 - Removed unsupported anyOf syntax
# REQUIRES: App must be connected to dev server or running as production build

appId: com.toonnotes.app

---
- launchApp

# Wait for home screen
- extendedWaitUntil:
    visible: "ToonNotes"
    timeout: 15000

# Create new note via FAB
- tapOn:
    id: "Create new note"
    optional: true

# Fallback: try FAB area
- tapOn:
    point: "90%,85%"
    optional: true

# Wait for editor
- extendedWaitUntil:
    visible: ".*"
    timeout: 5000

# Test title input
- tapOn:
    text: "Title"
    optional: true

- inputText: "Editor Test Note"

# Test content input
- tapOn:
    text: "Content"
    optional: true

- inputText: "Line 1 - Testing basic text input"

# Verify title is preserved
- assertVisible:
    text: "Editor Test Note"
    optional: true

# Wait for content to be visible
- extendedWaitUntil:
    visible: ".*"
    timeout: 3000

# Navigate back
- back

# Verify we're back on home screen
- extendedWaitUntil:
    visible: "ToonNotes"
    timeout: 5000

# Verify the note was saved
- assertVisible:
    text: "Editor Test Note"
    optional: true
