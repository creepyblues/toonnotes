# ToonNotes Subscription Purchase Flow
# Tests Pro subscription purchase and coin grant
# Note: In simulator, actual purchase requires Sandbox Apple ID
#
# UPDATED: February 2026 - Removed unsupported anyOf syntax

appId: com.toonnotes.app

---
- launchApp

# Wait for home screen
- extendedWaitUntil:
    visible: "ToonNotes"
    timeout: 15000

# Navigate to Settings tab
- tapOn: "Settings"

# Wait for Settings screen
- extendedWaitUntil:
    visible: "Settings"
    timeout: 5000

# Look for coin balance or Pro-related text
- assertVisible:
    text: "Pro"
    optional: true

- assertVisible:
    text: "Coins"
    optional: true

# Tap on Get Coins or Pro section to open CoinShop
- tapOn:
    text: "Get Coins"
    optional: true

- tapOn:
    text: "Pro"
    optional: true

# Wait for CoinShop modal to open (if it did)
- waitForAnimationToEnd

# Take a screenshot for verification
- takeScreenshot: subscription-screen
