# ToonNotes App Launch Verification
# Verifies the app launches successfully and displays the home screen
# Expected duration: ~10-15s
#
# UPDATED: February 2026 - Fixed selectors based on UI hierarchy

appId: com.toonnotes.app

---
- launchApp

# Wait for app to fully load
# "ToonNotes" is available as accessibilityText on the header
- extendedWaitUntil:
    visible: "ToonNotes"
    timeout: 15000

# Verify we're on the home screen
- assertVisible: "ToonNotes"
