# ToonNotes Settings Flow
# Tests Settings screen accessibility and navigation
# Expected duration: ~20-25s
#
# UPDATED: February 2026 - Dismiss dev error overlay before navigating
# REQUIRES: App must be connected to dev server or running as production build

appId: com.toonnotes.app

---
- launchApp

# Dismiss any dev error overlay (e.g. RNCWebViewModule not found)
- tapOn:
    text: "Dismiss"
    optional: true
- tapOn:
    text: "Minimize"
    optional: true

# Wait for home screen
- extendedWaitUntil:
    visible: "ToonNotes"
    timeout: 15000

# Navigate to Settings tab (try text first, fall back to tab bar position)
- tapOn:
    text: "Settings"
    optional: true
- tapOn:
    point: "90%,97%"
    optional: true

# Wait for Settings screen to load
- waitForAnimationToEnd

# Verify Settings screen loaded
- assertVisible:
    text: ".*"

# Check for common settings sections (optional, may vary)
- assertVisible:
    text: "Dark Mode"
    optional: true

- assertVisible:
    text: "Account"
    optional: true

# Test dark mode toggle if visible
- tapOn:
    text: "Dark Mode"
    optional: true

# Tap again to restore (if we changed it)
- tapOn:
    text: "Dark Mode"
    optional: true

# Navigate back to Notes/Home tab
- tapOn:
    text: "Notes"
    optional: true

- tapOn:
    text: "Home"
    optional: true

# Verify we're back on home screen
- extendedWaitUntil:
    visible: "ToonNotes"
    timeout: 5000
